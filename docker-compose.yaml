services:

  r1:
    build: .
    container_name: R1
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      r1-r2:
        ipv4_address: 192.168.5.2
      r5-r1:
        ipv4_address: 192.168.9.2
      r1-r3:
        ipv4_address: 192.100.1.2

  r2:
    build: .
    container_name: R2
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      r1-r2:
        ipv4_address: 192.168.5.3
      r2-r3:
        ipv4_address: 192.168.6.2
      r5-r2:
        ipv4_address: 192.100.2.3
  
  r3:
    build: .
    container_name: R3
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      r2-r3:
        ipv4_address: 192.168.6.3
      r3-r4:
        ipv4_address: 192.168.7.2
      r1-r3:
        ipv4_address: 192.100.1.3

  r4:
    build: .
    container_name: R4
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      r3-r4:
        ipv4_address: 192.168.7.3
      r4-r5:
        ipv4_address: 192.168.8.2

  r5:
    build: .
    container_name: R5
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      r4-r5:
        ipv4_address: 192.168.8.3
      r5-r1:
        ipv4_address: 192.168.9.3
      r5-r2:
        ipv4_address: 192.100.2.2

networks:

  r1-r2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.5.0/29

  r2-r3:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.6.0/29

  r3-r4:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.7.0/29

  r4-r5:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.8.0/29

  r5-r1:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.9.0/29

  r1-r3:
    driver: bridge
    ipam:
      config:
        - subnet: 192.100.1.0/29

  r5-r2:
    driver: bridge
    ipam:
      config:
        - subnet: 192.100.2.0/29